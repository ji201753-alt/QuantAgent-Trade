<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuantCore Terminal | Operational Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;900&display=swap');
      body { background: #000; margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .shadow-glow { shadow: 0 0 15px rgba(79,70,229,0.5); }
      .shadow-glow-green { shadow: 0 0 10px rgba(34,197,94,0.6); }
      .text-shadow-glow { text-shadow: 0 0 8px rgba(99,102,241,0.5); }
      .scrollbar-thin::-webkit-scrollbar { width: 3px; }
      .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
      .scrollbar-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
